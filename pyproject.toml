[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "execlab"
version = "0.1.0"
description = "Does short-horizon order flow information reduce the cost of executing a large order?"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Athish Shubhan" }]
dependencies = [
  "skeptic>=0.1",
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=14",
  "numba>=0.59",
  "scikit-learn>=1.4",
  "xgboost>=2.0",
  "optuna>=3.5",
  "matplotlib>=3.8",
  "tabulate>=0.9",
]

[project.optional-dependencies]
recorder = ["websockets>=12", "aiohttp>=3.9"]
dev = ["pytest>=8", "hypothesis>=6.90", "ruff>=0.4", "mypy>=1.8", "pandas-stubs"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "E731"]

[tool.ruff.lint.isort]
known-first-party = ["execlab", "skeptic"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
exclude = ["studies/", "tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
