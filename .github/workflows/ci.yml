name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: {repository: athish-shubhan/skeptic, path: skeptic}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -e ./skeptic -e ".[recorder,dev]"
      - run: make lint
      - run: make test
      - run: make reproduce
